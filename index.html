<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Planet Jumping — Immersive Space Portal Experience</title>
  <link rel="icon" href="public/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ====================================================================
       DOM STRUCTURE
       ==================================================================== -->
  <main class="experience" data-planet="mars">
    <div class="backgrounds" aria-hidden="true">
      <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
      <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
      <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
    </div>

    <div class="preloader" id="preloader" aria-label="Loading Mars">
      <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
      <div class="preloader-shade"></div>
    </div>

    <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural Logo">

    <div class="preloader-count" id="preloader-count" aria-live="polite">
      <span id="preloader-value">0</span><span class="percent">%</span>
    </div>

    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <header class="header chrome">
      <div class="header-actions">
        <nav class="nav" aria-label="Primary navigation">
          <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
        </nav>
        <button class="menu" type="button">Menu</button>
      </div>
    </header>

    <aside class="planet-list chrome" aria-label="Planets"></aside>

    <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>

    <section class="portal-wrap chrome" aria-label="Next destination">
      <div class="portal-heading">
        <span>Next:</span>
        <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
      </div>
      <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
        <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
        <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury" crossorigin="anonymous">
      </button>
    </section>

    <section class="planet-content chrome" aria-live="polite">
      <h1 id="planet-title">MARS</h1>
      <dl id="facts"></dl>
    </section>

    <div class="transition-layer" aria-hidden="true">
      <video id="transition-video" muted playsinline preload="auto" crossorigin="anonymous"></video>
    </div>

    <div class="loading" aria-hidden="true">Preparing orbit…</div>

    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
